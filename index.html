<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/images/beice-logo.png" />
    <link rel="shortcut icon" type="image/png" href="/images/beice-logo.png" />
    <link rel="apple-touch-icon" href="/images/beice-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--SEO_META-->
    <style>
      html body {
        background: #f8f8f8;
      }
      html[data-theme='dark'] body {
        background-color: #000;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: inherit;
        gap: 12px;
      }
      @keyframes loading-draw {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes loading-fill {
        30% { fill-opacity: 0.05; }
        100% { fill-opacity: 1; }
      }
      #loading-brand {
        --brand-accent: #1463ff;
        --brand-accent-soft: #52b7ff;
        --brand-surface: rgba(255, 255, 255, 0.72);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 18px;
        border: 1px solid rgba(17, 24, 39, 0.08);
        border-radius: 22px;
        background:
          radial-gradient(circle at top left, rgba(82, 183, 255, 0.12), transparent 42%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(244, 247, 251, 0.72));
        box-shadow:
          0 12px 40px rgba(15, 23, 42, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(14px);
        color: #1f1f1f;
      }
      #loading-brand svg {
        overflow: visible;
      }
      #loading-brand svg path {
        fill: currentcolor;
        fill-opacity: 0;
        stroke: currentcolor;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        stroke-width: 0.25em;
        animation:
          loading-draw 2s cubic-bezier(0.4, 0, 0.2, 1) infinite,
          loading-fill 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      #loading-brand .brand-mark {
        fill: url(#brand-chip-gradient);
        stroke: rgba(255, 255, 255, 0.75);
        stroke-width: 1;
      }
      #loading-brand .brand-mark-grid {
        fill: rgba(255, 255, 255, 0.9);
        fill-opacity: 1;
        stroke: none;
        stroke-dasharray: none;
        stroke-dashoffset: 0;
        stroke-width: 0;
        animation: none;
      }
      #loading-brand .brand-text-main {
        fill: url(#brand-text-gradient);
        font-weight: 700;
        letter-spacing: 6px;
      }
      #loading-brand .brand-text-shadow {
        fill: rgba(15, 23, 42, 0.1);
      }
      #loading-brand .brand-text-subline {
        fill: url(#brand-line-gradient);
      }
      html[data-theme='dark'] #loading-brand {
        --brand-accent: #5aa8ff;
        --brand-accent-soft: #8ef2ff;
        --brand-surface: rgba(10, 14, 24, 0.9);
        border-color: rgba(148, 163, 184, 0.18);
        background:
          radial-gradient(circle at top left, rgba(90, 168, 255, 0.22), transparent 45%),
          linear-gradient(135deg, rgba(18, 24, 38, 0.92), rgba(7, 11, 19, 0.88));
        box-shadow:
          0 18px 44px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        color: #f0f0f0;
      }
      html[data-theme='dark'] #loading-brand .brand-mark {
        stroke: rgba(255, 255, 255, 0.14);
      }
      html[data-theme='dark'] #loading-brand .brand-text-shadow {
        fill: rgba(0, 0, 0, 0.3);
      }
    </style>
    <script>
      (function () {
        function supportsImportMaps() {
          return (
            typeof HTMLScriptElement !== 'undefined' &&
            typeof HTMLScriptElement.supports === 'function' &&
            HTMLScriptElement.supports('importmap')
          );
        }

        function supportsCascadeLayers() {
          var el = document.createElement('div');
          el.className = '__layer_test__';
          el.style.position = 'absolute';
          el.style.left = '-99999px';
          el.style.top = '-99999px';

          var style = document.createElement('style');
          style.textContent =
            '@layer a, b;' +
            '@layer a { .__layer_test__ { color: rgb(1, 2, 3); } }' +
            '@layer b { .__layer_test__ { color: rgb(4, 5, 6); } }';

          document.documentElement.append(style);
          document.documentElement.append(el);

          var color = getComputedStyle(el).color;

          el.remove();
          style.remove();

          return color === 'rgb(4, 5, 6)';
        }

        if (!(supportsImportMaps() && supportsCascadeLayers())) {
          window.location.href = '/not-compatible.html';
          return;
        }

        var theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch (_) {}
        var systemTheme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        var resolvedTheme = theme === 'system' ? systemTheme : theme;
        if (resolvedTheme === 'dark' || resolvedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', resolvedTheme);
        }

        var hl = new URLSearchParams(location.search).get('hl');
        var m = document.cookie.match(/(?:^|;\s*)LOBE_LOCALE=([^;]*)/);
        var cookie = m ? decodeURIComponent(m[1]) : '';
        var locale = hl || cookie || navigator.language || 'en-US';
        if (locale === 'auto') locale = navigator.language || 'en-US';
        if (hl && !cookie) {
          document.cookie =
            'LOBE_LOCALE=' + encodeURIComponent(hl) + ';path=/;max-age=7776000;SameSite=Lax';
        }
        document.documentElement.lang = locale;
        var rtl = ['ar', 'arc', 'dv', 'fa', 'ha', 'he', 'khw', 'ks', 'ku', 'ps', 'ur', 'yi'];
        document.documentElement.dir =
          rtl.indexOf(locale.split('-')[0].toLowerCase()) >= 0 ? 'rtl' : 'ltr';
      })();
    </script>
    <script>
      window.__SERVER_CONFIG__ = undefined; /* SERVER_CONFIG */
    </script>
  </head>

  <body>
    <div id="loading-screen">
      <div id="loading-brand" aria-label="Loading" role="status">
        <svg height="52" style="flex:none;line-height:1" viewBox="0 0 236 52" xmlns="http://www.w3.org/2000/svg">
          <title>北测数字</title>
          <defs>
            <linearGradient id="brand-chip-gradient" x1="0%" x2="100%" y1="0%" y2="100%">
              <stop offset="0%" stop-color="var(--brand-accent-soft)" />
              <stop offset="100%" stop-color="var(--brand-accent)" />
            </linearGradient>
            <linearGradient id="brand-text-gradient" x1="0%" x2="100%" y1="0%" y2="0%">
              <stop offset="0%" stop-color="currentColor" />
              <stop offset="55%" stop-color="var(--brand-accent)" />
              <stop offset="100%" stop-color="var(--brand-accent-soft)" />
            </linearGradient>
            <linearGradient id="brand-line-gradient" x1="0%" x2="100%" y1="0%" y2="0%">
              <stop offset="0%" stop-color="var(--brand-accent)" stop-opacity="0.18" />
              <stop offset="50%" stop-color="var(--brand-accent)" stop-opacity="0.88" />
              <stop offset="100%" stop-color="var(--brand-accent-soft)" stop-opacity="0.18" />
            </linearGradient>
          </defs>
          <!-- <rect class="brand-mark" height="36" rx="12" width="36" x="0" y="8" /> -->
          <!-- <path class="brand-mark-grid" d="M10 18h6v6h-6zm10 0h6v6h-6zm10 0h-2v6h2zm-20 10h6v6h-6zm10 0h16v2H20zm0 4h10v2H20z" /> -->
          <text class="brand-text-shadow" x="51" y="34" font-size="29" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">北测数字</text>
          <text class="brand-text-main" x="49" y="32" font-size="29" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">北测数字</text>
          <rect class="brand-text-subline" height="2.5" rx="1.25" width="112" x="52" y="39" />
        </svg>
      </div>
    </div>
    <div id="root" style="height: 100%"></div>

    <!--ANALYTICS_SCRIPTS-->
    <script type="module" src="/src/spa/entry.web.tsx"></script>
  </body>
</html>
