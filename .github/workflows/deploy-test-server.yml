name: Deploy Test Server

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的分支、Tag 或 Commit SHA'
        required: true
        default: 'sd'
        type: string
      image_tag:
        description: '可选：指定已有镜像 Tag 用于回滚/复用。此时 ref 必须指向构建该镜像的同一提交；留空时自动按 ref + sha 构建新镜像'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  REGISTRY_IMAGE: lobehub/lobehub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          TEST_SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
          TEST_SERVER_PORT: ${{ secrets.TEST_SERVER_PORT }}
          TEST_SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
          TEST_SERVER_SSH_KEY: ${{ secrets.TEST_SERVER_SSH_KEY }}
          TEST_SERVER_DEPLOY_PATH: ${{ secrets.TEST_SERVER_DEPLOY_PATH }}
          TEST_ENV_FILE: ${{ secrets.TEST_ENV_FILE }}
        run: |
          set -euo pipefail

          missing=()

          for name in TEST_SERVER_HOST TEST_SERVER_PORT TEST_SERVER_USER TEST_SERVER_SSH_KEY TEST_SERVER_DEPLOY_PATH TEST_ENV_FILE; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done

          if [ -z "${{ inputs.image_tag }}" ]; then
            for name in DOCKER_REGISTRY_USER DOCKER_REGISTRY_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                missing+=("${name}")
              fi
            done
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Secrets: %s\n' "${missing[*]}" >&2
            echo "If you are building a new image, DOCKER_REGISTRY_USER and DOCKER_REGISTRY_PASSWORD must be configured." >&2
            echo "If you only want to redeploy an existing image, provide image_tag to skip the build step." >&2
            exit 1
          fi

      - name: Download target source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR=/tmp/lobehub-test-src
          ENCODED_REF=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${{ inputs.ref }}")
          API_URL="${{ github.api_url }}/repos/${{ github.repository }}/commits/${ENCODED_REF}"

          rm -rf "${SOURCE_DIR}"
          mkdir -p "${SOURCE_DIR}"

          API_RESPONSE=$(curl --silent --show-error --location \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}")

          COMMIT_SHA=$(printf '%s' "${API_RESPONSE}" | python3 -c 'import json,sys; payload=json.load(sys.stdin); sha=payload.get("sha"); message=payload.get("message", "Unknown error"); print(sha) if sha else (print(f"Failed to resolve ref: {message}", file=sys.stderr), sys.exit(1))')

          SHA_SHORT="${COMMIT_SHA:0:7}"
          TARBALL_URL="${{ github.api_url }}/repos/${{ github.repository }}/tarball/${COMMIT_SHA}"

          curl --silent --show-error --location \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${TARBALL_URL}" | tar -xz --strip-components=1 -C "${SOURCE_DIR}"

          echo "source_dir=${SOURCE_DIR}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            REF_NAME="${{ inputs.ref }}"
            REF_SANITIZED=$(echo "${REF_NAME}" | sed -E 's/[^a-zA-Z0-9_.-]+/-/g')
            SHA_SHORT="${{ steps.source.outputs.commit_sha_short }}"
            IMAGE_TAG="test-${REF_SANITIZED}-${SHA_SHORT}"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${REGISTRY_IMAGE}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${REGISTRY_IMAGE}:${IMAGE_TAG}"

      - name: Build and push image
        if: ${{ inputs.image_tag == '' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login \
            --username "${{ secrets.DOCKER_REGISTRY_USER }}" \
            --password-stdin

          docker build \
            --file "${{ steps.source.outputs.source_dir }}/Dockerfile" \
            --tag "${{ steps.vars.outputs.full_image }}" \
            --build-arg "SHA=${{ steps.source.outputs.commit_sha_short }}" \
            "${{ steps.source.outputs.source_dir }}"

          docker push "${{ steps.vars.outputs.full_image }}"

      - name: Validate rollback ref matches image tag
        if: ${{ inputs.image_tag != '' }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ inputs.image_tag }}"
          CHECKOUT_SHA="${{ steps.source.outputs.commit_sha_short }}"

          if [[ "${IMAGE_TAG}" =~ ^test-.+-([a-f0-9]+)$ ]]; then
            TAG_SHA="${BASH_REMATCH[1]}"

            if [ "${TAG_SHA}" != "${CHECKOUT_SHA}" ]; then
              echo "Rollback validation failed: image_tag '${IMAGE_TAG}' was not built from the checked out ref."
              echo "Current ref short SHA: ${CHECKOUT_SHA}"
              echo "Tag short SHA: ${TAG_SHA}"
              echo "Use a ref that points to the same commit as the image tag, or leave image_tag empty to build a new image."
              exit 1
            fi

            echo "Rollback validation passed for image_tag '${IMAGE_TAG}' and ref SHA '${CHECKOUT_SHA}'."
          else
            echo "image_tag '${IMAGE_TAG}' does not match the default test tag pattern test-...-<sha>."
            echo "Unable to auto-validate rollback safety; ensure ref and image_tag point to the same commit."
          fi

      - name: Prepare SSH config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.TEST_SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "${{ secrets.TEST_SERVER_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.TEST_SERVER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.TEST_SERVER_PORT }}" "${{ secrets.TEST_SERVER_HOST }}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Render remote env file
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/lobehub-test.env <<EOF
          LOBE_IMAGE=${{ steps.vars.outputs.full_image }}
          ${{ secrets.TEST_ENV_FILE }}
          EOF

      - name: Prepare remote deploy directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.TEST_SERVER_PORT }}" "${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}" \
            "mkdir -p '${{ secrets.TEST_SERVER_DEPLOY_PATH }}'"

      - name: Upload compose and env files
        shell: bash
        run: |
          set -euo pipefail
          scp -P "${{ secrets.TEST_SERVER_PORT }}" \
            "${{ steps.source.outputs.source_dir }}/docker-compose/deploy/docker-compose.test.yml" \
            "${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}:${{ secrets.TEST_SERVER_DEPLOY_PATH }}/docker-compose.yml"

          scp -P "${{ secrets.TEST_SERVER_PORT }}" \
            "${{ steps.source.outputs.source_dir }}/docker-compose/deploy/bucket.config.json" \
            "${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}:${{ secrets.TEST_SERVER_DEPLOY_PATH }}/bucket.config.json"

          scp -P "${{ secrets.TEST_SERVER_PORT }}" \
            "${{ steps.source.outputs.source_dir }}/docker-compose/deploy/searxng-settings.yml" \
            "${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}:${{ secrets.TEST_SERVER_DEPLOY_PATH }}/searxng-settings.yml"

          scp -P "${{ secrets.TEST_SERVER_PORT }}" \
            /tmp/lobehub-test.env \
            "${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}:${{ secrets.TEST_SERVER_DEPLOY_PATH }}/.env"

      - name: Deploy on remote server
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.TEST_SERVER_PORT }}" "${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}" <<'EOF'
          set -euo pipefail
          cd "${{ secrets.TEST_SERVER_DEPLOY_PATH }}"
          printf '%s\n' "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login \
            --username "${{ secrets.DOCKER_REGISTRY_USER }}" \
            --password-stdin
          docker compose pull
          docker compose up -d
          docker compose ps
          docker image prune -f
          EOF

      - name: Check app endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 10 --retry-delay 5 "http://${{ secrets.TEST_SERVER_HOST }}:3210/" >/tmp/lobehub-test-home.html
          test -s /tmp/lobehub-test-home.html

      - name: Print deployment result
        shell: bash
        run: |
          echo "部署完成"
          echo "镜像: ${{ steps.vars.outputs.full_image }}"
          echo "访问地址: http://${{ secrets.TEST_SERVER_HOST }}:3210"
